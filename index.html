<!DOCTYPE html>

<head>

<body>

  <!-- ========== ACTIVITY 1: Introduce Yourself ========== -->
  <header class="hero" id="home">
    <div class="hero__text">
      <h1 class="hero__name">Bert Denzel G. Elegino</h1>
      <p class="hero__tagline">Turning small ideas into working software.</p>
      <!-- EDIT: write 2-3 sentences about yourself in your own words -->
      <p class="hero__intro">

        systems, from a water billing project to Linux command-line labs.
        I learn best by making things and fixing what breaks.
      </p>
      <a class="btn" href="#">Learn More</a>
    </div>

    <figure class="hero__photo">
      <!-- EDIT: put your own photo at images/profile.jpg (the placeholder shows until you do) -->
      <img
        src="images/profile.jpg"
        alt="Portrait of "
        width="480" height="600"
        onerror="this.onerror=null;this.src='images/profile-placeholder.svg';">
    </figure>
  </header>
